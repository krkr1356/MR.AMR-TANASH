<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grade 8 - Video Lessons | Mr. Amr Tanash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00f2fe;
            --secondary-color: #4facfe;
            --accent-color: #7f00ff;
            --neon-glow: rgba(0, 242, 254, 0.5);
            --dark-bg: #030611;
            --card-bg: rgba(10, 15, 30, 0.65);
            --item-bg: rgba(18, 26, 48, 0.6);
            --text-light: #94a3b8;
            --white: #ffffff;
            --radius: 24px;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body, a, button, input {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24' fill='none' stroke='%2300f2fe' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10 2v7.31L4.75 18.1A2 2 0 0 0 6.44 21h11.12a2 2 0 0 0 1.69-2.9L14 9.31V2'/><line x1='8.5' y1='2' x2='15.5' y2='2'/><path d='M8.5 15h7'/></svg>") 0 0, auto !important;
        }
        body { background-color: var(--dark-bg); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; opacity: 0; transition: opacity 0.5s ease-in-out; }
        body.page-loaded { opacity: 1; }
        body::before, body::after { content: ''; position: fixed; width: 500px; height: 500px; border-radius: 50%; filter: blur(160px); z-index: -1; pointer-events: none; }
        body::before { background: var(--accent-color); top: -150px; left: -150px; opacity: 0.45; }
        body::after { background: var(--primary-color); bottom: -150px; right: -150px; opacity: 0.35; }
        .container { width: 88%; max-width: 1200px; margin: auto; padding: 20px 0; }
        header { background: rgba(3, 6, 17, 0.85); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 18px 0; position: sticky; top: 0; z-index: 1000; }
        .nav-box { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--primary-color); font-size: 24px; filter: drop-shadow(0 0 10px var(--primary-color)); }
        .back-btn { background: rgba(255, 255, 255, 0.05); color: #fff; text-decoration: none; padding: 8px 18px; border-radius: 30px; font-weight: 600; font-size: 13px; border: 1px solid rgba(255, 255, 255, 0.1); transition: var(--transition); }
        .back-btn:hover { background: var(--primary-color); color: #000; box-shadow: 0 0 15px var(--neon-glow); }
        .section-title { margin: 40px 0 35px; text-align: center; }
        .section-title h1 { font-size: 38px; font-weight: 900; }
        .gradient-text { background: linear-gradient(135deg, #fff 0%, var(--primary-color) 50%, #9b51e0 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .content-section { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius); padding: 30px; margin-bottom: 35px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); }
        .materials-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .material-card { background: var(--item-bg); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 22px; transition: var(--transition); display: flex; flex-direction: column; justify-content: space-between; }
        .material-card:hover { transform: translateY(-6px); border-color: rgba(0, 242, 254, 0.5); box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 242, 254, 0.2); }
        .card-icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(0, 242, 254, 0.1); color: var(--primary-color); display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 15px; border: 1px solid rgba(0, 242, 254, 0.25); }
        .card-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 20px; }
        .btn-open { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: linear-gradient(135deg, var(--secondary-color), var(--primary-color)); color: #000; font-weight: 800; font-size: 13px; text-decoration: none; border-radius: 12px; transition: var(--transition); }
        .btn-open:hover { box-shadow: 0 0 20px var(--neon-glow); transform: scale(1.02); }
        .empty-msg { color: var(--text-light); font-size: 14px; text-align: center; grid-column: 1 / -1; padding: 30px; }
        footer { background: rgba(2, 4, 10, 0.95); text-align: center; padding: 30px 0; border-top: 1px solid rgba(255, 255, 255, 0.08); margin-top: 40px; }
        .dev-badge-wrapper { display: inline-block; padding: 10px 28px; background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 50px; }
        .dev-text { font-size: 12px; font-weight: 700; color: var(--text-light); letter-spacing: 2px; text-transform: uppercase; font-family: 'Fira Code', monospace; }
        .dev-credit { color: #fff; font-weight: 900; background: linear-gradient(135deg, var(--primary-color), #fff, var(--accent-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <div class="container nav-box">
            <a href="dashboard.html" class="logo"><i class="fa-solid fa-atom"></i> MR. AMR TANASH</a>
        </div>
    </header>

    <div class="container">
        <div class="section-title">
            <h1>grade 8 <span class="gradient-text">Video Lessons</span> 🎥</h1>
        </div>

        <div class="content-section">
            <div id="materialsGrid" class="materials-grid">
                <p class="empty-msg">Loading video lessons...</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="dev-badge-wrapper">
                <p class="dev-text">Engineered & Crafted with <i class="fa-solid fa-code"></i> by <a href="https://www.instagram.com/nour_amr1356?igsh=MXQwOTZpNmMwc2sxMw==" target="_blank" class="dev-credit">NOUR</a></p>
            </div>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAuvKaJTzz-DG7nC1Yc4PPKrEGs3Lk3PtA",
            authDomain: "amrtanashscience.firebaseapp.com",
            databaseURL: "https://amrtanashscience-default-rtdb.firebaseio.com",
            projectId: "amrtanashscience",
            storageBucket: "amrtanashscience.firebasestorage.app",
            messagingSenderId: "561187270299",
            appId: "1:561187270299:web:1ff65d6003133204ad603e",
            measurementId: "G-WKZ5RVDW19"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadData() {
            const grid = document.getElementById('materialsGrid');
            try {
                const q = query(collection(db, "materials"), where("grade", "==", "grade 8"), where("type", "==", "video"));
                const querySnapshot = await getDocs(q);
                let html = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `
                        <div class="material-card">
                            <div>
                                <div class="card-icon"><i class="fa-solid fa-circle-play"></i></div>
                                <div class="card-title">${data.title}</div>
                            </div>
                            <a href="${data.url}" target="_blank" class="btn-open"><i class="fa-solid fa-play"></i> Watch Video</a>
                        </div>
                    `;
                });
                grid.innerHTML = html || `<p class="empty-msg">No video lessons available yet.</p>`;
            } catch (error) {
                console.error("Error: ", error);
            }
        }
        loadData();
    </script>
    <script>window.addEventListener('DOMContentLoaded', () => document.body.classList.add('page-loaded'));</script>
    <script>
    // 1. منع استخدام الكليك يمين
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
    });

    // 2. منع اختصارات لوحة المفاتيح الشهيرة للـ Inspect (F12, Ctrl+Shift+I, Ctrl+U, إلخ)
    document.addEventListener('keydown', function (e) {
        if (
            e.key === 'F12' ||
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
            (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
        ) {
            e.preventDefault();
            return false;
        }
    });

    // 3. حماية إضافية: توجيه المستخدم لو فتح أدوات الفحص (DevTools)
    setInterval(function () {
        const threshold = 160;
        const widthThreshold = window.outerWidth - window.innerWidth > threshold;
        const heightThreshold = window.outerHeight - window.innerHeight > threshold;
        
        if (widthThreshold || heightThreshold) {
            // يمكنك تغيير هذا الإجراء (مثل إعادة توجيه لصفحة بيضاء أو إغلاق الصفحة)
            document.body.innerHTML = '<h1 style="color:white; text-align:center; margin-top:20vh;">Inspect element is disabled on this website.</h1>';
        }
    }, 1000);
</script>
</body>
</html>
