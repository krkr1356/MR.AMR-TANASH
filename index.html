    <!-- 💻 ULTRA ENGINE JS: CONSOLE + PARTICLES + NEON TRAIL + 3D TILT -->
    <script>
        // 1. Executive Console Branding
        console.log(
            "%c ENGINEERED BY NOUR %c ARCHITECT & LEAD DEVELOPER %c",
            "background: linear-gradient(135deg, #00f2fe, #4facfe); color: #000; font-weight: 900; padding: 6px 12px; border-radius: 4px 0 0 4px;",
            "background: #7f00ff; color: #fff; font-weight: bold; padding: 6px 12px; border-radius: 0 4px 4px 0;",
            "background: transparent;"
        );
        console.log("%c⚡ Science Academy Engine v2.5 | Fully Operational", "color: #00f2fe; font-size: 11px; font-weight: 600;");

        // 2. Interactive Canvas Particles + Fluid Cursor Trail
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const trail = [];
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.5,
                dx: (Math.random() - 0.5) * 0.7,
                dy: (Math.random() - 0.5) * 0.7,
                color: Math.random() > 0.5 ? 'rgba(0, 242, 254, ' : 'rgba(127, 0, 255, '
            });
        }

        window.addEventListener('mousemove', (e) => {
            trail.push({
                x: e.clientX,
                y: e.clientY,
                radius: Math.random() * 4 + 2,
                alpha: 1
            });
        });

        function renderEngine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Constellations
            particles.forEach((p, index) => {
                p.x += p.dx;
                p.y += p.dy;

                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color + '0.4)';
                ctx.fill();

                for (let j = index + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 242, 254, ${0.14 - dist / 900})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            });

            // Draw Neon Fluid Cursor Trail
            for (let i = 0; i < trail.length; i++) {
                const t = trail[i];
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 242, 254, ${t.alpha * 0.5})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f2fe';
                ctx.fill();
                ctx.shadowBlur = 0;

                t.alpha -= 0.025;
                t.radius *= 0.96;

                if (t.alpha <= 0) {
                    trail.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(renderEngine);
        }
        renderEngine();

        // 3. 3D Parallax Tilt Effect for Cards
        const tiltCards = document.querySelectorAll('.js-tilt');
        tiltCards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                card.style.transform = `rotateY(${x / 20}deg) rotateX(${-y / 20}deg) translateY(-8px)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateY(0deg) rotateX(0deg) translateY(0px)';
            });
        });

        // Header Scroll Effect
        const header = document.getElementById('mainHeader');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 60) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>

                    if (data.status === 'approved') {
                        
                        const authBox = e.target.closest('.auth-box');
                        authBox.innerHTML = `
                            <div style="text-align: center; padding: 10px 0; animation: fadeIn 0.5s ease;">
                                <img src="welcome-meme.png" alt="Welcome Meme" style="width: 100%; max-width: 260px; border-radius: 18px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,242,254,0.4); border: 2px solid var(--primary-color);">
                                <h3 style="color: var(--primary-color); font-size: 22px; margin-bottom: 8px; justify-content: center;">نورت الساينس يا بطل! 🚀</h3>
                                <p style="color: #fff; font-weight: 700; font-size: 16px;">منور يا ${data.name}.. جاري تحضير الكورس 😉✨</p>
                            </div>
                        `;

                        setTimeout(() => {
                            document.body.classList.remove('page-loaded');
                            document.body.classList.add('page-exit');
                            setTimeout(() => {
                                window.location.href = "dashboard.html";
                            }, 400);
                        }, 2500);

                    } else {
                        alert("حسابك لسه مستني موافقة مستر عمرو طناش! ⏳");
                    }
                }
            } catch (error) {
                alert("فشل تسجيل الدخول: رقم التليفون أو الباسورد غلط!");
            }
        });
    </script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('page-loaded');
        });
    </script>
    <script>
    // 1. منع استخدام الكليك يمين
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
    });

    // 2. منع اختصارات لوحة المفاتيح الشهيرة للـ Inspect (F12, Ctrl+Shift+I, Ctrl+U, إلخ)
    document.addEventListener('keydown', function (e) {
        if (
            e.key === 'F12' ||
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
            (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
        ) {
            e.preventDefault();
            return false;
        }
    });

    // 3. حماية إضافية: توجيه المستخدم لو فتح أدوات الفحص (DevTools)
    setInterval(function () {
        const threshold = 160;
        const widthThreshold = window.outerWidth - window.innerWidth > threshold;
        const heightThreshold = window.outerHeight - window.innerHeight > threshold;
        
        if (widthThreshold || heightThreshold) {
            // يمكنك تغيير هذا الإجراء (مثل إعادة توجيه لصفحة بيضاء أو إغلاق الصفحة)
            document.body.innerHTML = '<h1 style="color:white; text-align:center; margin-top:20vh;">Inspect element is disabled on this website.</h1>';
        }
    }, 1000);
</script>
