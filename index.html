<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Amr Tannash | Science Academy</title>
    <!-- Font Awesome for Cool Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          // ⚠️ حط هنا الـ Public Key بتاعك من صفحة Account في EmailJS
          emailjs.init("YOUR_PUBLIC_KEY");
       })();
    </script>

    <style>
        /* --- COOL MODERN CSS STYLES --- */
        :root {
            --primary-color: #00f2fe;
            --secondary-color: #4facfe;
            --accent-color: #7f00ff;
            --dark-bg: #0b0f19;
            --card-bg: #161c2e;
            --light-bg: #f4f7fe;
            --text-dark: #1e293b;
            --text-light: #94a3b8;
            --white: #ffffff;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        html { scroll-behavior: smooth; }
        body { color: var(--text-dark); line-height: 1.6; background-color: var(--white); overflow-x: hidden; }
        .container { width: 88%; max-width: 1200px; margin: auto; }

        .gradient-text {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: #000;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
            transition: var(--transition);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 25px rgba(79, 172, 254, 0.4);
        }

        header {
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i { color: var(--primary-color); font-size: 26px; }

        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { text-decoration: none; color: var(--text-light); font-weight: 500; font-size: 15px; transition: var(--transition); }
        .nav-links a:hover { color: var(--primary-color); }

        section { padding: 100px 0 70px; }
        .section-title { text-align: center; margin-bottom: 50px; }
        .section-title h2 { font-size: 36px; font-weight: 700; margin-bottom: 10px; }

        /* Auth Section */
        #authSection {
            background: radial-gradient(circle at top right, #1a103c, var(--dark-bg));
            color: var(--white);
            padding-top: 140px;
            min-height: 80vh;
        }

        .auth-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            max-width: 900px;
            margin: auto;
        }

        .auth-box {
            background: var(--card-bg);
            padding: 35px;
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .auth-box h3 { margin-bottom: 20px; font-size: 22px; }

        .form-group { margin-bottom: 18px; }
        .form-group input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--white);
            outline: none;
        }
        .form-group input:focus { border-color: var(--primary-color); }

        footer { background: var(--dark-bg); color: var(--text-light); text-align: center; padding: 30px 0; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="container">
            <nav>
                <a href="#home" class="logo">
                    <i class="fa-solid fa-atom"></i> MR. AMR TANNASH
                </a>
                <ul class="nav-links">
                    <li><a href="#authSection">Student Portal</a></li>
                    <li><a href="admin.html" style="color: var(--primary-color);">Admin Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Student Auth Section -->
    <section id="authSection">
        <div class="container">
            <div class="section-title">
                <h2>Welcome to <span class="gradient-text">Science Academy</span></h2>
                <p style="color: var(--text-light);">Register an account or login to access your courses.</p>
            </div>

            <div class="auth-container">
                <!-- Register Form -->
                <div class="auth-box">
                    <h3><i class="fa-solid fa-user-plus"></i> New Student Sign Up</h3>
                    <form id="signupForm">
                        <div class="form-group">
                            <input type="text" id="studentName" placeholder="Full Student Name" required>
                        </div>
                        <div class="form-group">
                            <input type="tel" id="studentPhone" placeholder="Phone Number" required>
                        </div>
                        <div class="form-group">
                            <input type="password" id="studentPassword" placeholder="Create Password" required>
                        </div>
                        <button type="submit" class="btn" style="width: 100%; justify-content: center;">Register Account</button>
                    </form>
                </div>

                <!-- Login Form -->
                <div class="auth-box">
                    <h3><i class="fa-solid fa-right-to-bracket"></i> Student Login</h3>
                    <form id="loginForm">
                        <div class="form-group">
                            <input type="tel" id="loginPhone" placeholder="Phone Number" required>
                        </div>
                        <div class="form-group">
                            <input type="password" id="loginPassword" placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn" style="width: 100%; justify-content: center;">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Science Academy | Managed for <strong>MR. AMR TANNASH</strong>. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Firebase & Custom Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Config (المشروع الخاص بك)
        const firebaseConfig = {
            apiKey: "AIzaSyAuvKaJTzz-DG7nC1Yc4PPKrEGs3Lk3PtA",
            authDomain: "amrtanashscience.firebaseapp.com",
            databaseURL: "https://amrtanashscience-default-rtdb.firebaseio.com",
            projectId: "amrtanashscience",
            storageBucket: "amrtanashscience.firebasestorage.app",
            messagingSenderId: "561187270299",
            appId: "1:561187270299:web:1ff65d6003133204ad603e",
            measurementId: "G-WKZ5RVDW19"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Sign Up Handler
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('studentName').value;
            const phone = document.getElementById('studentPhone').value;
            const password = document.getElementById('studentPassword').value;
            const dummyEmail = phone + "@tannash.com";

            try {
                // 1. Create Auth Account
                const userCredential = await createUserWithEmailAndPassword(auth, dummyEmail, password);
                const uid = userCredential.user.uid;

                // 2. Save in Firestore Database
                await setDoc(doc(db, "students", uid), {
                    name: name,
                    phone: phone,
                    status: "pending",
                    createdAt: new Date()
                });

                // 3. 📧 Send Email via EmailJS
                // ⚠️ استبدل service_xxxxxxx بالـ Service ID بتاعك
                emailjs.send("service_xxxxxxx", "cigbba5", {
                    student_name: name,
                    student_phone: phone
                }).then(() => {
                    console.log("Email notification sent successfully!");
                }).catch((err) => {
                    console.error("Failed to send email notification:", err);
                });

                alert("Registered successfully! Your account is pending approval from Mr. Amr Tannash.");
                e.target.reset();

            } catch (error) {
                alert("Registration Error: " + error.message);
            }
        });

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;
            const dummyEmail = phone + "@tannash.com";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, dummyEmail, password);
                const uid = userCredential.user.uid;

                const studentDoc = await getDoc(doc(db, "students", uid));
                if (studentDoc.exists()) {
                    const data = studentDoc.data();
                    if (data.status === 'approved') {
                        alert(`Welcome back, ${data.name}! You are logged in successfully.`);
                    } else {
                        alert("Your account is still pending approval from Mr. Amr Tannash.");
                    }
                }
            } catch (error) {
                alert("Login Failed: Incorrect Phone or Password.");
            }
        });
    </script>
</body>
</html>
