<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("YOUR_PUBLIC_KEY");
       })();

    <style>
        :root {
            --primary-color: #00f2fe;
            --secondary-color: #4facfe;
            --accent-color: #7f00ff;
            --neon-pink: #ff007f;
            --dark-bg: #070a13;
            --card-bg: rgba(18, 24, 43, 0.65);
            --text-light: #94a3b8;
            --white: #ffffff;
            --radius: 24px;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        html { scroll-behavior: smooth; }
        
        /* 🎬 Page Transition & Glow Background */
        body { 
            color: var(--white); 
            line-height: 1.6; 
            background-color: var(--dark-bg); 
            overflow-x: hidden;
            position: relative;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            min-height: 100vh;
        }

        body.page-loaded { opacity: 1; }
        body.page-exit { opacity: 0; transform: scale(0.98); transition: all 0.4s ease-in-out; }

        /* 🌟 Cyberpunk Animated Ambient Spheres */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -1;
            animation: pulseGlow 10s infinite alternate ease-in-out;
            pointer-events: none;
        }
        body::before { background: var(--accent-color); top: -100px; left: -100px; opacity: 0.5; }
        body::after { background: var(--primary-color); bottom: -100px; right: -100px; opacity: 0.4; }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.3) translate(40px, 60px); }
        }

        .container { width: 88%; max-width: 1200px; margin: auto; }

        .gradient-text {
            background: linear-gradient(135deg, #fff 20%, var(--primary-color) 60%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        /* ⚡ Ultra Luxury Developer Badge (NOUR) */
        .dev-badge-wrapper {
            display: inline-block;
            padding: 8px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 50px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            transition: var(--transition);
        }

        .dev-badge-wrapper:hover {
            border-color: rgba(0, 242, 254, 0.6);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            transform: translateY(-3px);
        }

        .dev-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .dev-icon {
            color: var(--primary-color);
            margin: 0 5px;
            font-size: 15px;
            filter: drop-shadow(0 0 8px var(--primary-color));
        }

        .dev-credit {
            color: #ffffff;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--primary-color), #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
            text-decoration: none;
            transition: var(--transition);
            display: inline-block;
        }

        .dev-credit:hover {
            transform: scale(1.15);
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 1));
        }

        /* 🔘 Ultra Neon Glowing Button */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: #000;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            transition: var(--transition);
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.8);
            background: linear-gradient(135deg, var(--primary-color), #fff);
        }

        /* 🔝 Header & Navbar */
        header {
            background: rgba(7, 10, 19, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            animation: slideDown 0.8s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.5px;
        }

        .logo i { 
            color: var(--primary-color); 
            font-size: 28px;
            filter: drop-shadow(0 0 10px var(--primary-color));
            animation: spinAtom 15s linear infinite;
        }

        @keyframes spinAtom {
            100% { transform: rotate(360deg); }
        }

        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { 
            text-decoration: none; 
            color: var(--text-light); 
            font-weight: 600; 
            font-size: 14px; 
            transition: var(--transition);
            padding: 8px 16px;
            border-radius: 30px;
        }
        .nav-links a:hover { 
            color: var(--primary-color); 
            background: rgba(0, 242, 254, 0.08);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        /* ⚛️ Auth Section */
        #authSection {
            padding-top: 150px;
            padding-bottom: 80px;
            min-height: 90vh;
            position: relative;
        }

        .section-title { 
            text-align: center; 
            margin-bottom: 50px;
            animation: fadeIn 1s ease;
        }
        .section-title h2 { font-size: 44px; font-weight: 900; margin-bottom: 10px; letter-spacing: -1px; }

        .auth-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 35px;
            max-width: 950px;
            margin: auto;
        }

        /* 🧊 Dynamic Glassmorphism Auth Card */
        .auth-box {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: var(--transition);
            animation: fadeInUp 0.8s ease forwards;
            position: relative;
            overflow: hidden;
        }

        .auth-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--accent-color), var(--primary-color));
            opacity: 0.6;
            transition: var(--transition);
        }

        .auth-box:hover {
            border-color: rgba(0, 242, 254, 0.4);
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 242, 254, 0.25);
        }

        .auth-box:hover::before { opacity: 1; height: 5px; }

        .auth-box h3 { 
            margin-bottom: 25px; 
            font-size: 22px; 
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .auth-box h3 i { 
            color: var(--primary-color); 
            filter: drop-shadow(0 0 8px var(--primary-color)); 
        }

        .form-group { margin-bottom: 22px; }
        .form-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: var(--white);
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }
        .form-group input:focus { 
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        /* 🎈 Floating Animated Science Icons */
        .floating-icon {
            position: absolute;
            color: rgba(0, 242, 254, 0.06);
            font-size: 70px;
            z-index: -1;
            animation: float 7s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.15));
        }
        .icon-1 { top: 18%; left: 6%; animation-delay: 0s; }
        .icon-2 { bottom: 12%; right: 6%; animation-delay: 2s; }
        .icon-3 { top: 45%; right: 12%; animation-delay: 4s; }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            100% { transform: translateY(-30px) rotate(20deg) scale(1.1); }
        }

        /* 🌐 Social Links Buttons */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .social-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 22px;
            text-decoration: none;
            transition: var(--transition);
        }

        .social-btn.yt:hover { background: #ff0000; border-color: #ff0000; box-shadow: 0 0 25px rgba(255,0,0,0.8); transform: translateY(-6px) scale(1.1); }
        .social-btn.fb:hover { background: #1877f2; border-color: #1877f2; box-shadow: 0 0 25px rgba(24,119,242,0.8); transform: translateY(-6px) scale(1.1); }
        .social-btn.wa:hover { background: #25d366; border-color: #25d366; box-shadow: 0 0 25px rgba(37,211,102,0.8); transform: translateY(-6px) scale(1.1); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 🖤 🔥 NOUR's Footer */
        footer { 
            background: rgba(5, 7, 14, 0.95); 
            color: var(--text-light); 
            text-align: center; 
            padding: 40px 0 30px; 
            font-size: 15px; 
            border-top: 1px solid rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>

    <!-- Floating Background Icons -->
    <i class="fa-solid fa-atom floating-icon icon-1"></i>

    <!-- Header / Navbar -->

    <!-- Student Auth Section -->
    <section id="authSection">
        <div class="container">
            <div class="section-title">
                <h2>Welcome to <span class="gradient-text">Science Academy</span></h2>
                <p style="color: var(--text-light);">Register an account or login to access your courses.</p>
            </div>

            <div class="auth-container">

                <div class="auth-box">

                    <form id="signupForm">

                <a href="https://www.facebook.com/share/19E3cFiSYw/" target="_blank" class="social-btn fb" title="Facebook Page"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="https://wa.me/201099889339" target="_blank" class="social-btn wa" title="WhatsApp Contact"><i class="fa-brands fa-whatsapp"></i></a>
            </div>

            <!-- 🔥 FAKHM DEV BADGE (NO HEART) -->
            <div class="dev-badge-wrapper" style="margin-top: 25px;">
                <p class="dev-text">
                    Engineered & Crafted with <i class="fa-solid fa-code dev-icon"></i> by

    <!-- Firebase & Custom Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAuvKaJTzz-DG7nC1Yc4PPKrEGs3Lk3PtA",
            authDomain: "amrtanashscience.firebaseapp.com",
            databaseURL: "https://amrtanashscience-default-rtdb.firebaseio.com",
            projectId: "amrtanashscience",
            storageBucket: "amrtanashscience.firebasestorage.app",
            messagingSenderId: "561187270299",
            appId: "1:561187270299:web:1ff65d6003133204ad603e",
            measurementId: "G-WKZ5RVDW19"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Sign Up Handler
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('studentName').value;
            const phone = document.getElementById('studentPhone').value;
            const password = document.getElementById('studentPassword').value;
            const dummyEmail = phone + "@tannash.com";

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, dummyEmail, password);
                const uid = userCredential.user.uid;

                await setDoc(doc(db, "students", uid), {
                    name: name,
                    phone: phone,
                    status: "pending",
                    createdAt: new Date()
                });

                emailjs.send("YOUR_SERVICE_ID", "cigbba5", {
                    student_name: name,
                    student_phone: phone
                }).then(() => console.log("Email sent!"));

                // 📸 إظهار الصورة والجملة بدلاً من كارت التسجيل
                const authBox = e.target.closest('.auth-box');
                authBox.innerHTML = `
                    <div style="text-align: center; padding: 10px 0; animation: fadeIn 0.5s ease;">
                        <img src="waiting.png" alt="Waiting Approval" style="width: 100%; max-width: 220px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,242,254,0.3);">
                        <h3 style="color: var(--primary-color); font-size: 20px; margin-bottom: 8px; justify-content: center;">تم إرسال طلبك بنجاح! 🚀</h3>
                        <p style="color: #fff; font-weight: 700; font-size: 16px;">استنى أما نشوفلك مكان بقى.. 😉</p>
                        <p style="color: var(--text-light); font-size: 13px; opacity: 0.8; margin-top: 6px;">مستر عمرو هيراجع حسابك ويتفعل في أقرب وقت.</p>
                    </div>
                `;

            } catch (error) {
                alert("Registration Error: " + error.message);
            }
        });

        // Login Handler with Smooth Exit Transition
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;
            const dummyEmail = phone + "@tannash.com";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, dummyEmail, password);
                const uid = userCredential.user.uid;

                const studentDoc = await getDoc(doc(db, "students", uid));
                if (studentDoc.exists()) {
                    const data = studentDoc.data();
                    if (data.status === 'approved') {
                        alert(`Welcome back, ${data.name}!`);
                        
                        // 🎬 Smooth Page Transition Code
                        document.body.classList.remove('page-loaded');
                        document.body.classList.add('page-exit');
                        setTimeout(() => {
                            window.location.href = "dashboard.html";
                        }, 400);

                    } else {
                        alert("Your account is still pending approval from Mr. Amr Tannash.");
                    }
                }
            } catch (error) {
                alert("Login Failed: Incorrect Phone or Password.");
            }
        });
    </script>

    <!-- Page Transition Script -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('page-loaded');
        });

        document.querySelectorAll('a').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('javascript:')) {
                    e.preventDefault();
                    document.body.classList.remove('page-loaded');
                    document.body.classList.add('page-exit');
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                }
            });
        });
    </script>
